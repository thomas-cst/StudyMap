<div *ngIf="meteo?.daily" class="meteo-apercu-semaine">
  <div class="meteo-jour" *ngFor="let date of meteo.daily.time; let i = index">
    <div class="jour-label">{{ getJour(i, date) }}</div>
    <ng-container [ngSwitch]="meteo.daily.weathercode[i]">
      <!-- Soleil (code 0) -->
      <svg *ngSwitchCase="0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
      </svg>
      <!-- Nuage (codes 1, 2, 3) -->
      <svg *ngSwitchCase="1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 19.5A4.5 4.5 0 0 1 6 10.5a6 6 0 0 1 11.25-1.372A4.5 4.5 0 0 1 17.25 19.5h-10.5Z" />
      </svg>
      <svg *ngSwitchCase="2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 19.5A4.5 4.5 0 0 1 6 10.5a6 6 0 0 1 11.25-1.372A4.5 4.5 0 0 1 17.25 19.5h-10.5Z" />
      </svg>
      <svg *ngSwitchCase="3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 19.5A4.5 4.5 0 0 1 6 10.5a6 6 0 0 1 11.25-1.372A4.5 4.5 0 0 1 17.25 19.5h-10.5Z" />
      </svg>
      <!-- Pluie (codes 51, 53, 55, 61, 63, 65, 80, 81, 82) -->
      <svg *ngSwitchCase="51"  xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 19.5A4.5 4.5 0 0 1 6 10.5a6 6 0 0 1 11.25-1.372A4.5 4.5 0 0 1 17.25 19.5h-10.5Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 21v-2m3 2v-2m3 2v-2" />
      </svg>
      <svg *ngSwitchCase="53"  xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 19.5A4.5 4.5 0 0 1 6 10.5a6 6 0 0 1 11.25-1.372A4.5 4.5 0 0 1 17.25 19.5h-10.5Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 21v-2m3 2v-2m3 2v-2" />
      </svg>
      <svg *ngSwitchCase="55"  xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 19.5A4.5 4.5 0 0 1 6 10.5a6 6 0 0 1 11.25-1.372A4.5 4.5 0 0 1 17.25 19.5h-10.5Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 21v-2m3 2v-2m3 2v-2" />
      </svg>
      <svg *ngSwitchCase="61"  xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 19.5A4.5 4.5 0 0 1 6 10.5a6 6 0 0 1 11.25-1.372A4.5 4.5 0 0 1 17.25 19.5h-10.5Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 21v-2m3 2v-2m3 2v-2" />
      </svg>
      <svg *ngSwitchCase="63"  xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 19.5A4.5 4.5 0 0 1 6 10.5a6 6 0 0 1 11.25-1.372A4.5 4.5 0 0 1 17.25 19.5h-10.5Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 21v-2m3 2v-2m3 2v-2" />
      </svg>
      <svg *ngSwitchCase="65"  xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 19.5A4.5 4.5 0 0 1 6 10.5a6 6 0 0 1 11.25-1.372A4.5 4.5 0 0 1 17.25 19.5h-10.5Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 21v-2m3 2v-2m3 2v-2" />
      </svg>
      <svg *ngSwitchCase="80"  xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 19.5A4.5 4.5 0 0 1 6 10.5a6 6 0 0 1 11.25-1.372A4.5 4.5 0 0 1 17.25 19.5h-10.5Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 21v-2m3 2v-2m3 2v-2" />
      </svg>
      <svg *ngSwitchCase="81"  xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 19.5A4.5 4.5 0 0 1 6 10.5a6 6 0 0 1 11.25-1.372A4.5 4.5 0 0 1 17.25 19.5h-10.5Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 21v-2m3 2v-2m3 2v-2" />
      </svg>
      <svg *ngSwitchCase="82"  xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 19.5A4.5 4.5 0 0 1 6 10.5a6 6 0 0 1 11.25-1.372A4.5 4.5 0 0 1 17.25 19.5h-10.5Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 21v-2m3 2v-2m3 2v-2" />
      </svg>
      <!-- Brouillard (codes 45, 48) -->
      <svg *ngSwitchCase="45" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <ellipse cx="12" cy="17" rx="7" ry="2" fill="#cfd8dc" />
        <ellipse cx="12" cy="13" rx="9" ry="2" fill="#b0bec5" />
        <ellipse cx="12" cy="9" rx="6" ry="2" fill="#90a4ae" />
      </svg>
      <svg *ngSwitchCase="48" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <ellipse cx="12" cy="17" rx="7" ry="2" fill="#cfd8dc" />
        <ellipse cx="12" cy="13" rx="9" ry="2" fill="#b0bec5" />
        <ellipse cx="12" cy="9" rx="6" ry="2" fill="#90a4ae" />
      </svg>
      <!-- Neige (codes 71, 73, 75, 77, 85, 86) -->
      <svg *ngSwitchCase="71" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <circle cx="12" cy="16" r="4" fill="#b3e5fc" />
        <g stroke="#1976d2" stroke-width="1.5">
          <line x1="12" y1="14" x2="12" y2="18" />
          <line x1="10" y1="16" x2="14" y2="16" />
        </g>
      </svg>
      <svg *ngSwitchCase="73" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <circle cx="12" cy="16" r="4" fill="#b3e5fc" />
        <g stroke="#1976d2" stroke-width="1.5">
          <line x1="12" y1="14" x2="12" y2="18" />
          <line x1="10" y1="16" x2="14" y2="16" />
        </g>
      </svg>
      <svg *ngSwitchCase="75" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <circle cx="12" cy="16" r="4" fill="#b3e5fc" />
        <g stroke="#1976d2" stroke-width="1.5">
          <line x1="12" y1="14" x2="12" y2="18" />
          <line x1="10" y1="16" x2="14" y2="16" />
        </g>
      </svg>
      <svg *ngSwitchCase="77" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <circle cx="12" cy="16" r="4" fill="#b3e5fc" />
        <g stroke="#1976d2" stroke-width="1.5">
          <line x1="12" y1="14" x2="12" y2="18" />
          <line x1="10" y1="16" x2="14" y2="16" />
        </g>
      </svg>
      <svg *ngSwitchCase="85" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <circle cx="12" cy="16" r="4" fill="#b3e5fc" />
        <g stroke="#1976d2" stroke-width="1.5">
          <line x1="12" y1="14" x2="12" y2="18" />
          <line x1="10" y1="16" x2="14" y2="16" />
        </g>
      </svg>
      <svg *ngSwitchCase="86" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <circle cx="12" cy="16" r="4" fill="#b3e5fc" />
        <g stroke="#1976d2" stroke-width="1.5">
          <line x1="12" y1="14" x2="12" y2="18" />
          <line x1="10" y1="16" x2="14" y2="16" />
        </g>
      </svg>
      <!-- Orage (codes 95, 96, 99) -->
      <svg *ngSwitchCase="95" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <polygon points="12,2 15,10 13,10 16,18 9,11 11,11 8,2" fill="#ffd600" />
        <polyline points="12,2 15,10 13,10 16,18 9,11 11,11 8,2" fill="none" stroke="#ffab00" stroke-width="1.5" />
      </svg>
      <svg *ngSwitchCase="96" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <polygon points="12,2 15,10 13,10 16,18 9,11 11,11 8,2" fill="#ffd600" />
        <polyline points="12,2 15,10 13,10 16,18 9,11 11,11 8,2" fill="none" stroke="#ffab00" stroke-width="1.5" />
      </svg>
      <svg *ngSwitchCase="99" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <polygon points="12,2 15,10 13,10 16,18 9,11 11,11 8,2" fill="#ffd600" />
        <polyline points="12,2 15,10 13,10 16,18 9,11 11,11 8,2" fill="none" stroke="#ffab00" stroke-width="1.5" />
      </svg>
      <!-- Par défaut -->
      <svg *ngSwitchDefault xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="meteo-icon">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" fill="none" />
        <text x="12" y="16" text-anchor="middle" font-size="8" fill="currentColor">?</text>
      </svg>
    </ng-container>
    <div class="temp-max">{{ meteo.daily.temperature_2m_max[i] }}°C</div>
    <div class="temp-min">{{ meteo.daily.temperature_2m_min[i] }}°C</div>
  </div>
</div>
<div *ngIf="!meteo?.daily">
  <span>Météo non disponible</span>
</div>
